<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#183447}.s{font-size:16px;fill:#5e7484}.b{font-size:21px;font-weight:700}.n{font-size:18px;fill:white;font-weight:700}</style><rect width="900" height="345" rx="18" fill="#edf4f7"/><rect x="30" y="32" width="840" height="70" rx="10" fill="#fff" stroke="#d8e4eb"/><circle cx="62" cy="66" r="16" fill="#147d88"/><text x="57" y="72" class="n">1</text><text x="95" y="74" class="b" style="font-size:21px">先检查现有联网；依赖旧代理时保留连接和原代理设置</text><path d="M450,103 L450,128" stroke="#147d88" stroke-width="3" fill="none"/><circle cx="450" cy="128" r="5" fill="#147d88"/><rect x="30" y="142" width="840" height="70" rx="10" fill="#fff" stroke="#d8e4eb"/><circle cx="62" cy="176" r="16" fill="#147d88"/><text x="57" y="182" class="n">2</text><text x="95" y="184" class="b" style="font-size:21px">基础网络正常 → 核对订阅、已选配置、规则模式与公网节点</text><path d="M450,213 L450,238" stroke="#147d88" stroke-width="3" fill="none"/><circle cx="450" cy="238" r="5" fill="#147d88"/><rect x="30" y="252" width="840" height="70" rx="10" fill="#e2f4ef" stroke="#147d88"/><circle cx="62" cy="286" r="16" fill="#147d88"/><text x="57" y="292" class="n">3</text><text x="95" y="294" class="b" style="font-size:21px">重新启动 → 实际打开网页 → 仍失败时发送脱敏报错</text></svg>