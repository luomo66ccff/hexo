<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#183447}.s{font-size:16px;fill:#5e7484}.b{font-size:21px;font-weight:700}.n{font-size:18px;fill:white;font-weight:700}</style><rect width="900" height="300" rx="18" fill="#edf4f7"/><rect x="25" y="25" width="850" height="250" rx="10" fill="#ffffff" stroke="#d8e4eb"/><rect x="58" y="58" width="245" height="175" rx="10" fill="#f0faf9" stroke="#d8e4eb"/><text x="84" y="105" class="b" style="font-size:28px">▶ 启动</text><text x="84" y="147" class="b" style="font-size:18px">仪表盘运行按钮</text><text x="84" y="180" class="s">Windows 开系统代理</text><rect x="328" y="58" width="245" height="175" rx="10" fill="#fff5ef" stroke="#d8e4eb"/><text x="354" y="105" class="b" style="font-size:25px">■ 暂停 / 停止</text><text x="354" y="147" class="b" style="font-size:17px">再次点击运行按钮</text><text x="354" y="180" class="s">确认系统代理已关闭</text><rect x="598" y="58" width="245" height="175" rx="10" fill="#eff4ff" stroke="#d8e4eb"/><text x="624" y="105" class="b" style="font-size:28px">↻ 同步订阅</text><text x="624" y="147" class="b" style="font-size:16px">配置 → ⋮ → 同步</text><text x="624" y="180" class="s">刷新节点，不升级软件</text></svg>