favicon: /img/logo-192.png
subtitle:
  enable: true
  typed_option:
    startDelay: 300
    typeSpeed: 150
    backSpeed: 50
    loop: true
  sub:
    - 左青龙，右白虎，少吃碳水化合物
    - 我将飞上高空，变作天上的太阳，万众在我的光芒中热烈的生长
    - 人类从此会爱上夜晚，不再崇拜灿烂的艳阳
    - 倘若生命，生来软弱 ，弱者们又该向哪位神明寻求安宁
    - 愿母神三度为你阖眼，令你的血脉永远鼓动，旅途永远坦然，诡计永不败露
    - 如果强者的权势财富能掩盖罪行，谁能对他们予以裁决？
    - 如果弱者为延续生存需不惜代价，谁能为他们予以担保？
    - 如果至纯善的灵魂都会犯下过错，谁能给他们予以宽慰？
    - "若「以强援弱」果真是乐园的根基......\t又是谁徒留他们在苦难的人间哀号？"
    - 活在梦里的人们，真的能够远离痛苦，收获真正的幸福吗？
    - 「未来」的别名...正是「自我价值」。
    - 人们总是会忘记，曾经，当第一只鸟儿飞上天际，那时整个世界对它的期许......是自此以后，不再有任何雏鸟坠亡大地。
    - 钟表的指针周而复始，就像人的困惑、烦恼、软弱...摇摆不停。但最终，人们依旧要前进，就像你的指针，永远落在前方。
    - 所谓「开拓」，就是沿着前人未尽的道路，走出更遥远的距离......
    - 我梦见一片焦土，一株破土而生的新蕊，它迎着朝阳绽放，向我低语呢喃......飞萤扑火，向死而生。
    - 敬不完美的...明天。
    - 白昼与黑夜相等吗？义人与罪人相等吗？倘若人生来软弱——弱者们又该从哪位神明处寻得安宁？
    - 第一日，赐以「真实」...已死的星神，我向你致敬。第二日，赐以「历法」...第三日，赐以「言语」...以此七日誓言，命尔听从号令——第四日，赐以「价值」...第五日，赐以「规则」...第六日，赐以「意义」...并非是你造化万物。第七日，赐以「尊严」...即将见证【太初有为】！
    - 生命因何而沉睡？因为......总有一天......我们会从梦中醒来。
    - 谈判的三步式：先聆听；再试探；最后展露刀芒。
    - 敬匹诺康尼的过去、现在、未来...和稚子至死不渝的梦。
    - 时间会带走一切，珍惜当下。我知道，但让我很难释怀的...就是
    - 银河浩瀚，生命渺小，「开拓」的脚步从不停歇，但在宇宙的尺度下，普通人穷尽一生也只能走出一段短短的距离。
    - 人生苦短，良机莫失。
    - 眼下简直有太多不可能发生的事了,但它们就真的绝对不会发生吗?要我说,没准只是这些“不可能”被否定的瞬间还没到来而已。
    - 并非是命运塑造了我们，而是我们塑造了命运。
    - 所谓的不可能之事，只是尚未到来之事
    - 「隐瞒」远比「坦诚」更简单
    - 敬沉眠于地下的无名客们，还有我的好友，加拉赫。死亡是如此苦涩的事实，但你们所奉献的一切将被历史所铭记。我们不被外面的世界接受，因此才聚在这里。而终有一日，我们将魂归同处。
